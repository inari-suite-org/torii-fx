<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="torii: a runtime permission firewall for FiveM server-side Lua resources">
  <title>torii: a runtime permission firewall for FiveM server-side Lua resources</title>
  <rect width="1280" height="420" rx="28" fill="#F5F2E8"/>
  <rect x="0" y="392" width="1280" height="28" fill="#C8442B" opacity="0.95"/>
  <g transform="translate(46 56) scale(0.3125)">
  <circle cx="512" cy="512" r="400" fill="none" stroke="#131B19" stroke-width="28"/>
  <rect x="198" y="270" width="628" height="32" fill="#C8442B"/>
  <path d="M142 208 Q512 318 882 208 L862 250 Q512 360 164 250 Z" fill="#131B19"/>
  <rect x="320" y="410" width="384" height="382" fill="#131B19"/>
  <polygon points="282,300 332,300 332,792 264,792" fill="#C8442B"/>
  <polygon points="692,300 742,300 760,792 692,792" fill="#C8442B"/>
  <rect x="212" y="384" width="600" height="26" fill="#C8442B"/>
  <rect x="488" y="310" width="48" height="76" fill="#C8442B"/>
  <rect x="252" y="792" width="520" height="12" fill="#131B19"/>
  <rect x="268" y="816" width="488" height="8" fill="#131B19"/>
  <path d="M392 520 L418 440 L470 500 Q512 488 554 500 L606 440 L632 520 Q640 600 560 680 L512 720 L464 680 Q384 600 392 520 Z" fill="#212E2A"/>
  <path d="M392 540 C420 548 456 562 480 588 C444 592 408 578 392 540 Z" fill="#C8442B"/>
  <path d="M632 540 C604 548 568 562 544 588 C580 592 616 578 632 540 Z" fill="#C8442B"/>
  </g>
  <text x="400" y="178" font-family="Inter, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-3" fill="#131B19">torii</text>
  <text x="404" y="226" font-family="Inter, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#131B19">Least privilege for FiveM resources.</text>
  <text x="404" y="266" font-family="Inter, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-size="19" fill="#5B6662">Declare. Approve. Enforce. Backdoors have to knock.</text>
  <g font-family="Inter, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="404" y="298" width="132" height="40" rx="20" fill="#C8442B"/><text x="470" y="324" text-anchor="middle" fill="#F5F2E8">observe</text>
    <rect x="548" y="298" width="132" height="40" rx="20" fill="none" stroke="#C8442B" stroke-width="2"/><text x="614" y="324" text-anchor="middle" fill="#C8442B">enforce</text>
    <rect x="692" y="298" width="132" height="40" rx="20" fill="none" stroke="#5B6662" stroke-width="2"/><text x="758" y="324" text-anchor="middle" fill="#5B6662">MIT</text>
  </g>
  <g transform="translate(900 62)">
    <rect width="340" height="268" rx="16" fill="#1B2523"/>
    <circle cx="26" cy="26" r="7" fill="#FF5F57"/><circle cx="48" cy="26" r="7" fill="#FEBC2E"/><circle cx="70" cy="26" r="7" fill="#28C840"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">
      <text x="22" y="72" fill="#7F8A86">$ ensure shop_v2</text>
      <text x="22" y="104" fill="#E8B04A">WOULD BLOCK</text>
      <text x="128" y="104" fill="#D9DDDB">http -&gt; cipher-panel.example</text>
      <text x="22" y="136" fill="#7F8A86">$ set torii_mode "enforce"</text>
      <text x="22" y="168" fill="#FF6B57" font-weight="700">BLOCKED</text>
      <text x="104" y="168" fill="#D9DDDB">http -&gt; cipher-panel.example</text>
      <text x="22" y="198" fill="#FF6B57" font-weight="700">BLOCKED</text>
      <text x="104" y="198" fill="#D9DDDB">load() of downloaded text</text>
      <text x="22" y="228" fill="#6FCF97">ALLOWED</text>
      <text x="104" y="228" fill="#D9DDDB">api.weather.example/v1</text>
    </g>
  </g>
</svg>
