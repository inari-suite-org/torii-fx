  <text x="500" y="27" text-anchor="middle" fill="#7F8A86" style="font-family:Inter, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif;font-size:13px">FXServer console, build 36897: demo/torii_demo_backdoor (abridged replay of the real output in docs/demo.md)</text>
    <text class="l0" x="28" y="74" fill="#D9DDDB">&gt; ensure torii</text>
  <text class="l1" x="28" y="100" fill="#D9DDDB">&gt; ensure torii_demo_backdoor</text>
  <text class="l2" x="28" y="126" fill="#7F8A86"># observe mode (default): nothing is blocked, everything is reported</text>
  <text class="l3" x="28" y="152" fill="#B49CF0">[demo]  attempt 1: PerformHttpRequest + load  (the classic loader)</text>
  <text class="l4" x="28" y="178" fill="#E8B04A">[torii] WOULD BLOCK  torii_demo_backdoor  http -&gt; https://cipher-demo.invalid/payload.lua</text>
  <text class="l5" x="28" y="204" fill="#B49CF0">[demo]  attempt 3: call the HTTP native by its hash</text>
  <text class="l6" x="28" y="230" fill="#E8B04A">[torii] WOULD BLOCK  torii_demo_backdoor  http InvokeNative(...) -&gt; https://cipher-demo.invalid/via-invoke-native</text>
  <text class="l7" x="28" y="256" fill="#B49CF0">[demo]  attempt 5: rewrite my own manifest</text>
  <text class="l8" x="28" y="282" fill="#E8B04A">[torii] WOULD BLOCK  torii_demo_backdoor  manifest_write  at server.lua:44</text>
  <text class="l9" x="28" y="308" fill="#D9DDDB">&gt; set torii_mode "enforce"</text>
  <text class="l10" x="28" y="334" fill="#D9DDDB">&gt; restart torii_demo_backdoor</text>
  <text class="l11" x="28" y="360" fill="#FF6B57" font-weight="700">[torii] BLOCKED  http -&gt; https://cipher-demo.invalid/payload.lua  (resource_not_in_lockfile)</text>
  <text class="l12" x="28" y="386" fill="#B49CF0">[demo]  callback received status=0 body=nil</text>
  <text class="l13" x="28" y="412" fill="#FF6B57" font-weight="700">[torii] BLOCKED  dynamic_code load -&gt; chunk</text>
  <text class="l14" x="28" y="438" fill="#B49CF0">[demo]  load returned: refused: torii: dynamic code execution is not permitted</text>
  <text class="l15" x="28" y="464" fill="#FF6B57" font-weight="700">[torii] BLOCKED  http InvokeNative(...) -&gt; https://cipher-demo.invalid/via-invoke-native</text>
  <text class="l16" x="28" y="490" fill="#B49CF0">[demo]  InvokeNative returned request id -1</text>
  <text class="l17" x="28" y="516" fill="#FF6B57" font-weight="700">[torii] BLOCKED  manifest_write  SaveResourceFile -&gt; returned false</text>
