  <rect width="1000" height="550" rx="20" fill="#121A1A"/>
  <path d="M0 20a20 20 0 0 1 20-20h960a20 20 0 0 1 20 20v26H0z" fill="#1B2523"/>
  <text x="28" y="29" fill="#8C9792" style="font-family:'Geist', 'Segoe UI', system-ui, Helvetica, Arial, sans-serif;font-size:13px;animation:none;opacity:1">FXServer console, build 36897. Abridged replay of docs/demo.md</text>
    <text class="l0" x="28" y="78" fill="#F5F3EA">&gt; ensure torii_demo_backdoor</text>
  <text class="l1" x="28" y="104" fill="#8C9792">observe mode (default): nothing is blocked, everything is reported</text>
  <text class="l2" x="28" y="130" fill="#B8B4A4">[demo]  attempt 1: PerformHttpRequest, then load  (the classic loader)</text>
  <text class="l3" x="28" y="156" fill="#E8B04A">[torii] WOULD BLOCK  torii_demo_backdoor  http -&gt; https://cipher-demo.invalid/payload.lua</text>
  <text class="l4" x="28" y="182" fill="#B8B4A4">[demo]  attempt 3: call the HTTP native by its hash</text>
  <text class="l5" x="28" y="208" fill="#E8B04A">[torii] WOULD BLOCK  torii_demo_backdoor  http InvokeNative(...) -&gt; https://cipher-demo.invalid/via-invoke-native</text>
  <text class="l6" x="28" y="234" fill="#B8B4A4">[demo]  attempt 5: rewrite my own manifest</text>
  <text class="l7" x="28" y="260" fill="#E8B04A">[torii] WOULD BLOCK  torii_demo_backdoor  manifest_write  at server.lua:44</text>
  <text class="l8" x="28" y="286" fill="#F5F3EA">&gt; set torii_mode "enforce"</text>
  <text class="l9" x="28" y="312" fill="#F5F3EA">&gt; restart torii_demo_backdoor</text>
  <text class="l10" x="28" y="338" fill="#E8664B" font-weight="700">[torii] BLOCKED  http -&gt; https://cipher-demo.invalid/payload.lua  (resource_not_in_lockfile)</text>
  <text class="l11" x="28" y="364" fill="#B8B4A4">[demo]  callback received status=0 body=nil</text>
  <text class="l12" x="28" y="390" fill="#E8664B" font-weight="700">[torii] BLOCKED  dynamic_code load -&gt; chunk</text>
  <text class="l13" x="28" y="416" fill="#B8B4A4">[demo]  load returned: refused: torii: dynamic code execution is not permitted</text>
  <text class="l14" x="28" y="442" fill="#E8664B" font-weight="700">[torii] BLOCKED  http InvokeNative(...) -&gt; https://cipher-demo.invalid/via-invoke-native</text>
  <text class="l15" x="28" y="468" fill="#B8B4A4">[demo]  InvokeNative returned request id -1</text>
  <text class="l16" x="28" y="494" fill="#E8664B" font-weight="700">[torii] BLOCKED  manifest_write  SaveResourceFile returned false</text>
